<!-- ===== SAVAT KODI ===== -->
<script>
let cart = JSON.parse(localStorage.getItem('cart_v1')) || [];

document.querySelectorAll('.add-to-cart').forEach(btn=>{
  btn.addEventListener('click', function(e){
    e.preventDefault();

    const item = {
      id: this.dataset.id,
      title: this.dataset.title,
      img: this.dataset.img,
      price: Number(this.dataset.price),
      qty: 1
    };

    let exist = cart.find(p => p.id === item.id);
    exist ? exist.qty++ : cart.push(item);

    localStorage.setItem('cart_v1', JSON.stringify(cart));
    alert("✅ Mahsulot savatga qo‘shildi!");
    window.location.href = "savat.html";
  });
});
</script>

<!-- ===== QIDIRUV ===== -->
<script>
document.addEventListener("DOMContentLoaded", function() {
  const input = document.getElementById("searchInput");
  const results = document.getElementById("searchResults");
  const cards = document.querySelectorAll(".telefon");

  let products = [];
  cards.forEach((c,i)=>{
    c.id = "product-"+i;
    products.push({
      id: c.id,
      title: c.querySelector("h4").innerText,
      img: c.querySelector("img").src,
      el: c
    });
  });

  input.addEventListener("input", e=>{
    let t = e.target.value.toLowerCase();
    results.innerHTML = "";
    if(!t){ results.style.display="none"; return;}

    products.filter(p=>p.title.toLowerCase().includes(t))
      .forEach(p=>{
        let d=document.createElement("div");
        d.innerHTML=`<img src="${p.img}"><span>${p.title}</span>`;
        d.onclick=()=>{
          p.el.scrollIntoView({behavior:"smooth",block:"center"});
          p.el.classList.add("highlight");
          setTimeout(()=>p.el.classList.remove("highlight"),1500);
          results.style.display="none";
          input.value="";
        }
        results.appendChild(d);
        results.style.display="block";
      });
  });
});
</script>
